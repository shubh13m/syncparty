<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YTParty — Watch YouTube together</title>
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0a0a0a;
        color: #fafafa;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 350ms ease;
      }
      html.light #splash { background: #ffffff; color: #18181b; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .badge {
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 8px 32px rgba(255, 0, 0, 0.22));
        animation: splash-pop 500ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      #splash .badge svg { display: block; }
      html.light #splash .badge .front { fill: #18181b; }
      #splash .word {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        opacity: 0;
        animation: splash-fade 400ms ease 200ms forwards;
      }
      #splash .word .yt { color: #FF0000; }
      #splash .tag {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #737373;
        opacity: 0;
        animation: splash-fade 400ms ease 350ms forwards;
      }
      @keyframes splash-pop {
        0%   { transform: scale(0.6); opacity: 0; }
        100% { transform: scale(1);   opacity: 1; }
      }
      @keyframes splash-fade {
        0%   { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .badge, #splash .word, #splash .tag { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <script>
      // Apply saved theme before first paint to avoid flash.
      (function () {
        try {
          var t = localStorage.getItem('syncparty:theme');
          if (t === 'light') document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
    <div id="splash" role="status" aria-label="Loading YTParty">
      <div class="badge">
        <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
          <path class="front" d="M22 20 L58 48 L22 76 Z" fill="#fafafa"/>
          <path d="M42 20 L78 48 L42 76 Z" fill="#FF0000"/>
        </svg>
      </div>
      <div class="word"><span class="yt">YT</span>Party</div>
      <div class="tag">Watch YouTube together</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
